name: Continuous Integration

on:
  push:
    branches:
      - main
      - 'vishal-*'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Python 3.11 + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: airbnb_clone_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest anyio httpx

      - name: Run Full Pytest Suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/airbnb_clone_test
          SECRET_KEY: ci-test-secret-key-min-32-chars-airbnb
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          PROJECT_NAME: "Airbnb Clone CI"
          API_V1_STR: /api
          CORS_ORIGINS: '["http://localhost:3000"]'
        run: pytest tests/ -v --tb=short

  # ─── Frontend ─────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build Check (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Next.js App
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ─── Docker Compose Smoke Test ────────────────────────────────────────────────
  docker-smoke:
    name: Docker Compose Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images (no push)
        env:
          POSTGRES_PASSWORD: ci-smoke-pass
          SECRET_KEY: ci-smoke-secret-key-at-least-32-chars
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: docker compose build --no-cache
